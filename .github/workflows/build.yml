name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # GigaAM, Parakeet и Silero VAD не хранятся в git.
      # Скрипт фиксирует имена, версии и URL; конфиг фиксирует состав ресурсов,
      # поэтому оба файла обновляют ключ кеша при смене состава speech-моделей.
      - name: Cache speech dependencies
        id: cache-speech
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/model
          key: speech-${{ runner.os }}-${{ hashFiles('scripts/fetch-deps.ps1', 'src-tauri/tauri.conf.json') }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Fetch speech dependencies
        shell: powershell
        run: .\scripts\fetch-deps.ps1

      - run: npm ci

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check
        continue-on-error: true # в проекте пока нет единого форматирования

      - name: Build installer
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: Reever-nsis-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
