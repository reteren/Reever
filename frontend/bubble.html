<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Reever</title>
<style>
  @font-face { font-family: 'Handjet'; src: url('fonts/Handjet.ttf') format('truetype'); font-weight: 100 900; font-display: block; }
  :root {
    --acc: #27E6AA; --acc-hot: #C8FFEC; --acc-3: rgba(39, 230, 170, .46); --acc-5: rgba(39, 230, 170, .10);
    --glass: #020A08; --glass-2: #05150F;
    --g2: 0 0 1px rgba(39, 230, 170, .9), 0 0 7px rgba(39, 230, 170, .45);
    --f-lcd: 'Handjet', 'Segoe UI', 'Microsoft YaHei UI', 'Yu Gothic UI', sans-serif;
    --ax: 170px;   /* хвостик — над головой маскота, его задаёт Rust */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  /* Терминал без рамки — то же чёрное стекло с люминофором, что экраны программы. Растёт
     вверх от хвостика; когда строк больше, чем помещается, видны последние. */
  .bubble {
    position: absolute; left: 20px; right: 20px; bottom: 9px;
    max-height: 380px; display: flex; flex-direction: column; justify-content: flex-end;
    padding: 9px 13px 10px; border-radius: 10px; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 40%, var(--glass-2) 0%, var(--glass) 70%), var(--glass);
    color: var(--acc-hot); text-shadow: var(--g2);
    font: 400 19px/1.22 var(--f-lcd); font-variation-settings: 'ELSH' 2, 'ELGR' 1; letter-spacing: .03em;
    overflow-wrap: anywhere;
    /* Закрывается, сжимаясь к своему хвостику: сначала тает текст, потом само стекло
       стягивается в точку над головой маскота. Открывается обратно — из хвостика. */
    transform-origin: calc(var(--ax) - 20px) 100%;
    opacity: 0; transform: translateY(3px) scale(.5, .12);
    transition: opacity .34s cubic-bezier(.4, 0, .9, .6) .08s, transform .42s cubic-bezier(.55, 0, .7, .2) .06s;
  }
  .bubble.on {
    opacity: 1; transform: none;
    transition: opacity .16s ease-out, transform .3s cubic-bezier(.16, 1, .3, 1);
  }
  .bubble > div { transition: opacity .16s ease-in; }
  .bubble:not(.on) > div { opacity: 0; }
  .bubble::before {
    /* сканлайны ЭЛТ */
    content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .28) 0 1px, transparent 1px 3px);
  }
  /* хвостик — просто чёрный треугольник из того же стекла */
  .tail {
    position: absolute; bottom: 0; left: clamp(34px, var(--ax), calc(100% - 34px)); width: 0; height: 0;
    margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top: 9px solid var(--glass);
    transform-origin: 50% 100%; opacity: 0; transform: scale(.2);
    transition: opacity .2s ease-in .3s, transform .24s cubic-bezier(.55, 0, .7, .2) .28s;
  }
  .tail.on { opacity: 1; transform: none; transition: opacity .12s ease-out, transform .2s cubic-bezier(.16, 1, .3, 1); }
  .prompt { color: var(--acc-3); margin-right: .35em; }
  .caret { display: inline-block; width: .5em; height: .95em; margin-left: .12em; vertical-align: -.1em; background: var(--acc); box-shadow: 0 0 6px var(--acc); animation: blink 1s steps(1) infinite; }
  .caret.off { display: none; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div class="bubble" id="bubble"><div><span class="prompt">›</span><span id="text"></span><span class="caret" id="caret"></span></div></div>
<div class="tail" id="tail"></div>
<script>
document.addEventListener('contextmenu', (e) => e.preventDefault());
// Пузырь над маскотом: что говорится, пишется сюда по ходу речи. Окно ставит над головой
// осьминога Rust (bubble.rs) и разрешает показываться, только пока маскот на экране.
//  reever://partial — текущая фраза по ходу речи (пусто — фраза кончилась);
//  reever://said    — готовый кусок диктовки («напиши …»): они копятся;
//  reever://heard   — окончательный текст команды.
// Пузырь живёт, пока Reever слушает и выполняет команду, и гаснет чуть погодя после.
(function () {
  const tauri = window.__TAURI__;
  const { invoke } = tauri.core;
  const listen = tauri.event.listen;
  const win = tauri.window.getCurrentWindow();
  const $ = (id) => document.getElementById(id);
  const HOLD_MS = 1600;   // сколько пузырь держится после конца команды

  let allowed = false, active = false, committed = '', live = '', holdTimer = 0;
  const join = (a, b) => (a && b ? `${a} ${b}` : a || b);

  function render() {
    const text = join(committed, live).trim();
    if (text) $('text').textContent = text;
    $('caret').classList.toggle('off', !active || !!holdTimer);
    const on = allowed && active && !!text;
    $('bubble').classList.toggle('on', on);
    $('tail').classList.toggle('on', on);
  }

  listen('reever://state', (e) => {
    const s = String(e.payload);
    if (s === 'listening' || s === 'busy') {
      if (!active || holdTimer) { if (!active) { committed = ''; live = ''; } active = true; }
      clearTimeout(holdTimer); holdTimer = 0;
    } else if (s !== 'loading' && active && !holdTimer) {
      // текст остаётся до следующей команды: пузырь закрывается вместе с ним, не пустея рывком
      holdTimer = setTimeout(() => { holdTimer = 0; active = false; render(); }, HOLD_MS);
    }
    render();
  });
  listen('reever://partial', (e) => { live = String(e.payload || '').trim(); if (live && !active) { active = true; committed = ''; } render(); });
  listen('reever://said', (e) => { committed = join(committed, String(e.payload || '').trim()); live = ''; render(); });
  listen('reever://heard', (e) => { const v = String(e.payload || '').trim(); if (v) { committed = v; live = ''; } render(); });

  function relayout() {
    invoke('bubble_layout').then(([ok, ax]) => {
      allowed = !!ok;
      document.documentElement.style.setProperty('--ax', `${ax}px`);
      render();
    }).catch(() => {});
  }
  win.listen('bubble://layout', relayout);
  relayout();
})();
</script>
</body>
</html>
