<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reever</title>
    <script>if (window.__REEVER_LITE__ || /[?&]lite\b/.test(location.search)) document.documentElement.classList.add('lite');</script>
    <link rel="stylesheet" href="skin.css" />
    <link rel="stylesheet" href="lite.css" />
    <style>
      /* Плашка подтверждения опасной команды: та же хромовая рамка, что у окна выбора
         (skin/picker_frame.webp), под вырезами — ЭЛТ-экраны. Ответ — кнопкой или голосом. */
      #cf { position: absolute; inset: 0; width: 620px; height: 520px; }
      #cfDrag { position: absolute; inset: 0; z-index: 0; }
      #cfFrame { position: absolute; left: 0; top: 0; width: 620px; height: 520px; z-index: 3; pointer-events: none; }
      #cfTitle {
        left: 40px; top: 38px; width: 342px; height: 38px; border-radius: 11px; z-index: 1;
        display: flex; align-items: center; gap: 8px; padding: 0 14px;
      }
      #cfTitle .ico { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; filter: drop-shadow(0 0 4px var(--acc)); }
      #title {
        flex: 1; min-width: 0; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        font: 500 21px/1 var(--f-lcd); font-variation-settings: 'ELSH' 2, 'ELGR' 1; letter-spacing: .05em;
        text-transform: uppercase; color: var(--acc-hot); text-shadow: var(--g3);
      }
      #cfScreen {
        left: 40px; top: 88px; width: 540px; height: 394px; border-radius: 13px; z-index: 1;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px 28px;
        text-align: center;
      }
      #cfClose { left: 568px; top: 57px; --b-off: url(skin/btn_close_off.webp); --b-on: url(skin/btn_close_on.webp); --d: 30px; }
      #question {
        margin: 0; max-width: 100%; overflow-wrap: anywhere;
        font: 500 38px/1.05 var(--f-lcd); font-variation-settings: 'ELSH' 2, 'ELGR' 1; letter-spacing: .05em;
        text-transform: uppercase; color: var(--acc-hot); text-shadow: var(--g3);
        animation: blink 1.2s steps(2, jump-none) 3;
      }
      .voice { font-size: 14px; color: var(--acc-3); text-shadow: var(--g1); }
      .voice strong { color: var(--acc-2); font-weight: 600; }
      .answers { display: flex; gap: 26px; }
      .answers button {
        width: 170px; height: 70px; padding: 0; font-size: 34px; letter-spacing: .12em; border-radius: 8px;
      }
      .answers button:focus-visible { outline: 2px dashed var(--acc-hot); outline-offset: 4px; }
      .timer { width: 100%; display: grid; gap: 7px; }
      .bar { height: 6px; border-radius: 3px; background: var(--acc-5); border: 1px solid var(--acc-4); overflow: hidden; }
      #fill { height: 100%; width: 100%; background: var(--acc); box-shadow: 0 0 10px var(--acc); transform-origin: left; }
      #left {
        font: 500 16px/1 var(--f-lcd); font-variation-settings: 'ELSH' 2, 'ELGR' 1; letter-spacing: .06em;
        text-transform: uppercase; color: var(--acc-3); font-variant-numeric: tabular-nums;
      }
    </style>
    <script src="skin/nomenu.js"></script>
    <script src="i18n/i18n.js"></script>
    <script src="skin/tooltip.js" defer></script>
    <script src="skin/drag.js" defer></script>
  </head>
  <body>
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3.5l9.5 17h-19zM12 10v4.5M12 17.2v.3"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    </svg>
    <div id="cf">
      <div id="cfDrag" data-tauri-drag-region></div>
      <img id="cfFrame" src="skin/picker_frame.webp" alt="" draggable="false" />
      <div class="lcd" id="cfTitle" data-tauri-drag-region>
        <svg class="ico" aria-hidden="true"><use href="#i-warn"/></svg>
        <h1 id="title" data-tauri-drag-region data-i18n="confirm.title">Confirmation</h1>
      </div>
      <button class="lunka" id="cfClose" data-i18n-title="confirm.noTitle" data-i18n-aria-label="confirm.no"><svg class="ico"><use href="#i-x"/></svg></button>
      <div class="lcd" id="cfScreen" role="alertdialog" aria-labelledby="question">
        <h2 id="question"></h2>
        <div class="voice" data-i18n-html="confirm.voice"></div>
        <div class="answers">
          <button class="danger" id="yes" data-i18n="confirm.yes">Yes</button>
          <button class="default" id="no" data-i18n="confirm.no">No</button>
        </div>
        <div class="timer">
          <div class="bar"><div id="fill"></div></div>
          <div id="left"></div>
        </div>
      </div>
    </div>
    <script>
      const tauri = window.__TAURI__;
      const invoke = tauri?.core?.invoke || (async () => {});
      const $ = selector => document.querySelector(selector);
      let question = null;
      let timer = 0;

      function render() {
        const { kind, app } = question;
        const key = ['shutdown', 'restart', 'close', 'kill'].includes(kind) ? `confirm.${kind}` : 'confirm.generic';
        $('#question').textContent = t(key, { app, action: kind });
        // Опасное действие: по умолчанию в фокусе «Нет» — случайный Enter ничего не выключит.
        $('#no').focus();
        countdown();
      }

      // Полоска и «отмена через N с»: столько же ждёт ответа голосом аудио-поток.
      function countdown() {
        clearInterval(timer);
        const total = Math.max(1, Number(question.seconds) || 8) * 1000;
        const started = performance.now();
        const tick = () => {
          const left = Math.max(0, total - (performance.now() - started));
          $('#fill').style.transform = `scaleX(${left / total})`;
          $('#left').textContent = t('confirm.left', { seconds: Math.ceil(left / 1000) });
          if (!left) clearInterval(timer);
        };
        tick();
        timer = setInterval(tick, 100);
      }

      async function answer(yes) {
        if (!question) return;
        const session = question.session;
        question = null;
        clearInterval(timer);
        await invoke('confirm_answer', { session, yes });
      }

      $('#yes').onclick = () => answer(true);
      $('#no').onclick = () => answer(false);
      $('#cfClose').onclick = () => answer(false);
      document.addEventListener('keydown', event => {
        if (!question) return;
        if (event.key === 'Escape') { event.preventDefault(); answer(false); }
        else if (['ArrowLeft', 'ArrowRight'].includes(event.key)) {
          event.preventDefault();
          (document.activeElement === $('#yes') ? $('#no') : $('#yes')).focus();
        }
      });

      // Язык — из settings.json при каждом показе: его могли сменить в главном окне.
      async function applyLanguage() {
        let preference = 'auto';
        try {
          const saved = await invoke('get_settings');
          preference = saved?.ui_language || 'auto';
          I18N.setEnabled(saved?.ui_languages);
        } catch {}
        await I18N.setLanguage(preference);
      }

      // Предпросмотр в браузере для снимков (?shot): пример вопроса без backend.
      if (!tauri && new URLSearchParams(location.search).has('shot')) {
        document.body.style.background = '#2a2f33';
        I18N.setLanguage(new URLSearchParams(location.search).get('lang') || 'ru').then(() => {
          question = { session: 1, kind: 'shutdown', app: '', seconds: 8 };
          render();
        });
      }

      async function listenForQuestion() {
        if (!tauri?.event?.listen) return;
        await tauri.event.listen('reever://confirm', async event => {
          await applyLanguage();
          question = event.payload;
          render();
        });
        await invoke('confirm_ready');
      }
      listenForQuestion();
    </script>
  </body>
</html>
