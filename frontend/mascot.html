<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Reever</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
  canvas.head { cursor: grab; }
  canvas.held { cursor: grabbing; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="skin/fps.js"></script>
<script src="skin/orb.js"></script>
<script src="skin/mascot.js"></script>
<script>
// Окно маскота: осьминог в правом нижнем углу экрана. Рисует его skin/mascot.js; здесь — окно:
// раскладка, перетаскивание за голову и показ. Приходит и уходит маскот через портал.
// Окно до двух раз больше осьминога, чтобы портал не обрезался; клики оно пропускает сквозь себя
// везде, кроме осьминога в покое (это ведёт Rust, ему сообщает mascot_rest). Размер и запас
// задаёт Rust (mascot_layout): на крупных размерах окно не больше экрана, и запас меньше.
(function () {
  const SPR_W = 120, SPR_H = 160;  // осьминог в покое при 100 %
  const PAD = 22;                   // поля под свечение вокруг него — видимая часть окна
  const FLY_W = 328, FLY_H = 408;   // кадр портала при 100 %, с тем же центром, что и окно
  const HEAD_BOTTOM = 0.58;         // доля высоты кадра: выше — голова, ниже — щупальца
  const tauri = window.__TAURI__;
  const win = tauri.window.getCurrentWindow();
  const { invoke } = tauri.core;
  const canvas = document.getElementById('c');
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  // осьминог стоит — окно ловит мышь над ним; в портале или исчез — мышь проходит насквозь
  const setResting = (rest) => invoke('mascot_rest', { rest }).catch(() => {});
  const view = window.SkinMascot.create(canvas, { glow: true, onArrived: () => setResting(true) });

  let big = 2;
  function resize() {
    const W = (SPR_W + 2 * PAD) * big, H = (SPR_H + 2 * PAD) * big;
    view.layout({
      W, H, k: canvas.clientWidth / W || 1,
      spr: [(W - SPR_W) / 2, (H - SPR_H) / 2, SPR_W, SPR_H],
      fly: [(W - FLY_W) / 2, (H - FLY_H) / 2, FLY_W, FLY_H],
    });
  }

  // ── Хват за голову ────────────────────────────────────────────────
  // Окно за курсором ведёт Rust (mascot_drag): захват указателя в WebView2 теряется,
  // как только окно поехало. Об отпускании кнопки приходит событие mascot://drop.
  let held = false;
  const onHead = (e) => { const r = canvas.getBoundingClientRect(); return view.onHead(e.clientX - r.left, e.clientY - r.top, HEAD_BOTTOM); };
  canvas.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || held || !onHead(e)) return;
    held = true;
    canvas.classList.add('held');
    view.grab();
    invoke('mascot_drag').catch((err) => { console.error('mascot drag', err); drop(); });
  });
  canvas.addEventListener('pointermove', (e) => { if (!held) canvas.classList.toggle('head', onHead(e)); });
  function drop() {
    if (!held) return;
    held = false;
    canvas.classList.remove('held');
    view.drop();
  }
  win.listen('mascot://drop', drop);

  // ── Показ: маскота прячет и показывает Rust ──────────────────────
  // Окно при этом не скрывается и не обрезается (у прозрачного окна без рамки при этом мелькает
  // белая рамка Windows): спрятанный маскот — пустой холст, и петля рисования стоит.
  // payload true — маскот только что показан: выйти из портала; false — уже на экране: если
  // уходил в портал, вернуться.
  let entered = false;
  win.listen('mascot://enter', (e) => {
    entered = true;
    if (view.mode === 'portal_in') return;
    if (e.payload || view.mode === 'gone') { setResting(false); view.arrive(); }
    else if (view.mode === 'portal_out') { view.present(); setResting(true); }
  });
  win.listen('mascot://leave', () => { if (!held && view.mode !== 'gone') { setResting(false); view.depart(); } });
  // Под нагрузкой события из разных потоков Rust доходят с опозданием: «спрятать» мог
  // догнать уже следующий показ. Сверяемся с Rust — если маскоту положено быть на экране, выйти.
  win.listen('mascot://hidden', () => {
    entered = false; setResting(false); view.absent(); view.stop();
    invoke('mascot_layout').then(([, , shown]) => { if (shown && !entered && view.mode === 'gone') { setResting(false); view.arrive(); } }).catch(() => {});
  });

  // запас окна и виден ли маскот знает Rust; пока ответа нет — двукратный запас
  let laidOut = false;
  function relayout() {
    invoke('mascot_layout').then(([, b, shown]) => {
      big = b || 2; resize();
      if (laidOut) return;
      laidOut = true;
      // «enter» мог прийти раньше, чем страница загрузилась, — тогда он пролетел мимо
      if (!entered && shown) { setResting(false); view.arrive(); }
    }).catch(() => resize());
  }
  window.addEventListener('resize', relayout);
  resize();
  relayout();
})();
</script>
</body>
</html>
