<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Reever</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
  canvas.head { cursor: grab; }
  canvas.held { cursor: grabbing; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="skin/orb.js"></script>
<script>
// Маскот: пререндер из Blender (octobus chrome rig.blend).
//  grab_0001–0084 (Octo_Grab)  — подхват: 1–36 голова тянется, щупальца повисают; 36–84 — цикл покачивания;
//  idle_0001–0096 (Octo_Idle)  — покой: переминается, поворачивается, перебирает щупальцами;
//  appear_/leave_0001–0058 (Octo_Appear / Octo_Leave, 48 к/с) — прилёт издалека мёртвой петлёй
//    и улёт зеркально. Кадры полёта — на всё окно; по экрану летит само окно (mascot/anim.json, path).
//  portal_in_/portal_out_0001–0058 (Octo_PortalIn/Out + Portal_In/Out, 48 к/с) — другой вариант
//    (настройка «Как появляется»): выход из портала и уход в него. Окно стоит на месте, частицы
//    вокруг портала рисуются здесь (центр и радиус портала по кадрам — anim.json, portal).
// Жидкость в глазу — живая линза главного окна (skin/orb.js) с теми же состояниями распознавания;
// купол глаза по кадрам — mascot/anim.json (eye: центр и две полуоси эллипса, доли кадра, и насколько
// глаз смотрит в камеру). Свечение — размытый силуэт текущего кадра, следует за состоянием и голосом.
// Окно до двух раз больше осьминога, чтобы в полёте ничего не обрезалось; клики оно пропускает
// сквозь себя везде, кроме осьминога в покое (это ведёт Rust, ему сообщает mascot_rest). Размер
// и запас задаёт Rust (mascot_layout): на крупных размерах окно не больше экрана, и запас меньше.
(function () {
  const FRAMES = 84, LOOP_FROM = 35, IDLE_FRAMES = 96, FLY_FRAMES = 58, FPS = 24, FLY_FPS = 48;
  const SPR_W = 120, SPR_H = 160;  // осьминог в покое при 100 %
  const PAD = 22;                   // поля под свечение вокруг него — видимая часть окна
  const FLY_W = 328, FLY_H = 408;   // кадр полёта при 100 %, с тем же центром, что и окно
  // окно при 100 % — видимая часть × запас (big); осьминог в покое — по центру
  let big = 2, WIN_W = 328, WIN_H = 408, SPR_X = 104, SPR_Y = 124;
  const HEAD_BOTTOM = 0.58;   // доля высоты кадра: выше — голова, ниже — щупальца
  const RELEASE_FROM = 19;    // с какого кадра подхвата играть возврат задом наперёд
  const GRAB_SPEED = 1.5;     // ускорение подхвата и возврата относительно 24 к/с
  const EYE_INSET = 0.97;     // линза чуть меньше купола: край прячется под хромовое кольцо
  const GLOW = [70, 205, 165]; // акцент, приглушённый до матового
  const tauri = window.__TAURI__;
  const win = tauri.window.getCurrentWindow();
  const { invoke } = tauri.core;
  const { PhysicalPosition } = tauri.dpi;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const spr = document.createElement('canvas'), sctx = spr.getContext('2d', { willReadFrequently: true });
  const sil = document.createElement('canvas'), gctx = sil.getContext('2d');
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  const load = (name, count) => Array.from({ length: count }, (_, i) => {
    const img = new Image();
    img.src = `mascot/${name}_${String(i + 1).padStart(4, '0')}.webp`;
    return img;
  });
  const SETS = {
    grab: load('grab', FRAMES), idle: load('idle', IDLE_FRAMES),
    appear: load('appear', FLY_FRAMES), leave: load('leave', FLY_FRAMES),
    portal_in: load('portal_in', FLY_FRAMES), portal_out: load('portal_out', FLY_FRAMES),
  };
  let anim = null;
  fetch('mascot/anim.json').then((r) => r.json()).then((a) => { anim = a; }).catch((e) => console.error('mascot anim', e));

  const eyeCanvas = document.createElement('canvas');
  let eye = null;
  try { eye = window.SkinOrb.createCore(eyeCanvas, 40); } catch (e) { console.error('mascot orb', e); }

  // ── Состояния — те же, что у линзы в главном окне (skin/shell.js) ───
  const spring = (v, k, c) => ({ v, t: v, vel: 0, k, c });
  const stepSpring = (s, dt) => { const a = s.k * (s.t - s.v) - s.c * s.vel; s.vel += a * dt; s.v += s.vel * dt; return s.v; };
  const S = {
    fill: spring(0, 46, 7.5), energy: spring(0, 30, 10), wave: spring(0, 40, 12), swirl: spring(0, 10, 6),
    dark: spring(0, 18, 9), glitch: spring(0, 60, 14), glow: spring(0, 14, 7),
  };
  const STATES = {
    idle:      { fill: .17, energy: .55, wave: .14, swirl: 0, dark: 0, glitch: 0, glow: .45 },
    listening: { fill: .72, energy: 1.0, wave: .32, swirl: 0, dark: 0, glitch: 0, glow: .85 },
    busy:      { fill: .9, energy: 1.12, wave: .22, swirl: 1, dark: 0, glitch: 0, glow: 1 },
    loading:   { fill: .3, energy: .6, wave: .1, swirl: .3, dark: 0, glitch: 0, glow: .4 },
    paused:    { fill: 0, energy: .12, wave: 0, swirl: 0, dark: 1, glitch: 0, glow: .12 },
    error:     { fill: .22, energy: .5, wave: .1, swirl: 0, dark: .3, glitch: 1, glow: .35 },
  };
  let state = 'idle', level = 0, levelRaw = 0, flash = 0;
  function setState(name) {
    state = STATES[name] ? name : 'idle';
    for (const k in S) S[k].t = STATES[state][k];
  }
  setState('idle');
  tauri.event.listen('reever://state', (e) => setState(String(e.payload)));
  tauri.event.listen('reever://level', (e) => {
    const rms = Number(e.payload) || 0;
    levelRaw = state === 'listening' || state === 'busy' ? Math.max(0, Math.min(1, (20 * Math.log10(rms + 1e-6) + 54) / 40)) : 0;
  });
  tauri.event.listen('reever://heard', (e) => { if (String(e.payload || '').trim()) flash = 1; });
  invoke('get_ui_snapshot').then((s) => s && setState(String(s.state || 'idle'))).catch(() => {});

  // ── Кадры ─────────────────────────────────────────────────────────
  // mode: rest | grab | release | appear | leave | gone (улетел, окно вот-вот спрячут)
  // k — масштаб окна относительно 100 %, u — пикселей холста на исходный CSS-пиксель
  let frame = 0, idleFrame = 0, mode = 'gone', acc = 0, last = 0, drawn = null, dpr = 1, k = 1, u = 1;
  let home = null;            // позиция окна в покое (физические пиксели) — от неё летит полёт
  const t0 = performance.now();
  // прилёт/уход: полёт петлёй или портал (настройка «Как появляется», её сообщает Rust)
  let entrance = 'flight';
  const ARRIVALS = ['appear', 'portal_in'], DEPARTURES = ['leave', 'portal_out'];
  const arrival = () => (entrance === 'portal' ? 'portal_in' : 'appear');
  const departure = () => (entrance === 'portal' ? 'portal_out' : 'leave');
  const flying = () => ARRIVALS.includes(mode) || DEPARTURES.includes(mode);

  function resize() {
    dpr = window.devicePixelRatio || 1;
    WIN_W = (SPR_W + 2 * PAD) * big; WIN_H = (SPR_H + 2 * PAD) * big;
    SPR_X = (WIN_W - SPR_W) / 2; SPR_Y = (WIN_H - SPR_H) / 2;
    k = canvas.clientWidth / WIN_W || 1;
    u = k * dpr;
    for (const c of [canvas, spr, sil]) { c.width = Math.round(canvas.clientWidth * dpr); c.height = Math.round(canvas.clientHeight * dpr); }
    eye?.resize(k);
    drawn = null;
  }
  // текущий кадр: картинка, её прямоугольник в окне и данные глаза
  function current() {
    if (mode === 'gone') return null;
    if (flying()) return { img: SETS[mode][frame], rect: [(WIN_W - FLY_W) / 2, (WIN_H - FLY_H) / 2, FLY_W, FLY_H], eye: anim?.eye[mode][frame] };
    if (mode === 'rest') return { img: SETS.idle[idleFrame], rect: [SPR_X, SPR_Y, SPR_W, SPR_H], eye: anim?.eye.idle[idleFrame] };
    return { img: SETS.grab[frame], rect: [SPR_X, SPR_Y, SPR_W, SPR_H], eye: anim?.eye.grab[frame] };
  }
  // спрайт и его силуэт перерисовываются, только когда сменился кадр
  function prepare(cur) {
    if (!cur.img.complete || !cur.img.naturalWidth) return false;
    if (drawn === cur.img) return true;
    const [x, y, w, h] = cur.rect;
    sctx.clearRect(0, 0, spr.width, spr.height);
    sctx.drawImage(cur.img, x * u, y * u, w * u, h * u);
    gctx.globalCompositeOperation = 'copy';
    gctx.drawImage(spr, 0, 0);
    gctx.globalCompositeOperation = 'source-in';
    gctx.fillStyle = `rgb(${GLOW.join(',')})`;
    gctx.fillRect(0, 0, sil.width, sil.height);
    drawn = cur.img;
    return true;
  }
  function advance() {
    if (mode === 'rest') idleFrame = (idleFrame + 1) % IDLE_FRAMES;
    else if (mode === 'grab') frame = frame + 1 >= FRAMES ? LOOP_FROM : frame + 1;
    else if (mode === 'release') { frame = Math.max(0, frame - 1); if (frame === 0) { mode = 'rest'; idleFrame = 0; } }
    else if (flying()) {
      if (frame + 1 < FLY_FRAMES) { frame++; moveAlongPath(); }
      else if (ARRIVALS.includes(mode)) land();
      else vanish();
    }
  }
  function tick(t) {
    const dt = Math.min(0.05, last ? (t - last) / 1000 : 0.016);
    acc += dt;
    last = t;
    // Возврат быстрее подхвата: осьминог «ставится» на место.
    // Подхват (ноги вытягиваются) и возврат (сворачиваются) — в 1,5 раза быстрее
    // съёмки; покачивание в руке и покой — в родном темпе.
    const fps = flying() ? FLY_FPS
      : mode === 'release' ? FPS * 1.6 * GRAB_SPEED
      : mode === 'grab' && frame < LOOP_FROM ? FPS * GRAB_SPEED
      : FPS;
    const step = 1 / fps;
    while (acc >= step) { acc -= step; advance(); }

    // уровень: быстрая атака, медленный спад — как в главном окне
    level += (levelRaw - level) * (levelRaw > level ? 0.55 : 0.12);
    const T = STATES[state], time = (t - t0) / 1000;
    const lv = state === 'listening' ? level : state === 'busy' ? level * 0.4 : 0;
    S.fill.t = T.fill + lv * 0.2 + (state === 'loading' ? Math.sin(time * 2.2) * 0.08 : 0);
    S.wave.t = T.wave + lv * 2.4;
    S.energy.t = T.energy + lv * 0.5;
    S.glow.t = T.glow + lv * 0.9;
    for (const k in S) stepSpring(S[k], dt);
    flash = Math.max(0, flash - dt * 2.6);

    portalSparks(dt);
    const cur = current();
    if (!cur) { ctx.clearRect(0, 0, canvas.width, canvas.height); drawn = null; }
    else if (prepare(cur)) draw(cur, time, dt);
    if (running) requestAnimationFrame(tick); else loop = false;
  }
  function draw(cur, time, dt) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // издалека осьминог проявляется, улетая — растворяется
    ctx.globalAlpha = flying() ? (anim?.path[mode][frame]?.[2] ?? 1) : 1;
    const base = ctx.globalAlpha;
    // свечение: мягко «дышит» и разгорается от голоса и принятой команды
    const g = Math.max(0, S.glow.v + flash * 0.8) * (0.85 + 0.15 * Math.sin(time * 1.7));
    if (g > 0.01) {
      ctx.filter = `blur(${((7 + 5 * Math.min(1.5, g)) * u).toFixed(1)}px)`;
      ctx.globalAlpha = base * Math.min(1, 0.75 * g);
      ctx.drawImage(sil, 0, 0);
      ctx.filter = `blur(${(3 * u).toFixed(1)}px)`;
      ctx.globalAlpha = base * Math.min(1, 0.35 * g);
      ctx.drawImage(sil, 0, 0);
      ctx.filter = 'none';
    }
    ctx.globalAlpha = base;
    ctx.drawImage(spr, 0, 0);
    // линза — по эллипсу купола; отвернувшийся глаз не светится
    const e = cur.eye;
    const facing = e ? Math.max(0, Math.min(1, (e[6] - 0.15) / 0.3)) : 0;
    if (eye && e && facing > 0) {
      eye.render({ time, fill: Math.max(0, S.fill.v), wave: S.wave.v, energy: Math.max(0, S.energy.v), swirl: S.swirl.v, flash, dark: Math.max(0, S.dark.v), glitch: Math.max(0, S.glitch.v) });
      const [x, y, w, h] = cur.rect;
      ctx.globalAlpha = base * facing;
      ctx.setTransform(e[2] * w * u, e[3] * h * u, e[4] * w * u, e[5] * h * u, (x + e[0] * w) * u, (y + e[1] * h) * u);
      ctx.drawImage(eyeCanvas, -EYE_INSET, -EYE_INSET, 2 * EYE_INSET, 2 * EYE_INSET);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }
    ctx.globalAlpha = 1;
    drawSparks(dt);
  }

  // ── Частицы портала ───────────────────────────────────────────────
  // orbit — искры, бегущие по кольцу; burst — выброс наружу, когда осьминог выходит и когда
  // портал схлопывается; suck — затягивание внутрь при уходе. Координаты — CSS-пиксели при 100 %.
  const ACC = [39, 230, 170];
  const sparks = [];
  const spawnAcc = { orbit: 0, burst: 0, suck: 0 };
  let popped = false;
  const rnd = (a, b) => a + Math.random() * (b - a);
  function portalNow() {
    const p = anim?.portal?.[mode]?.[frame];
    if (!p) return null;
    return { x: (WIN_W - FLY_W) / 2 + p[0] * FLY_W, y: (WIN_H - FLY_H) / 2 + p[1] * FLY_H, r: p[2] };
  }
  function spawn(kind, P) {
    const a = rnd(0, Math.PI * 2);
    if (kind === 'orbit') sparks.push({ kind, a, rr: rnd(0.92, 1.12), w: rnd(2.2, 4.2), life: 0, max: rnd(0.35, 0.8), size: rnd(0.7, 1.8) });
    else if (kind === 'suck') sparks.push({ kind, a, rr: rnd(1.3, 2.3), w: rnd(2.5, 4.5), vr: rnd(1.6, 2.6), life: 0, max: 1.4, size: rnd(0.7, 1.9) });
    else {
      const sp = rnd(70, 230), r0 = P.r * rnd(0, 0.35);
      sparks.push({ kind, x: P.x + Math.cos(a) * r0, y: P.y + Math.sin(a) * r0, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, max: rnd(0.4, 0.9), size: rnd(0.8, 2.2) });
    }
  }
  function portalSparks(dt) {
    if (mode !== 'portal_in' && mode !== 'portal_out') { popped = false; return; }
    const P = portalNow();
    if (!P) return;
    const t = frame / (FLY_FRAMES - 1);
    const rate = { orbit: P.r > 6 ? 110 : 0, burst: 0, suck: 0 };
    if (mode === 'portal_in' && t > 0.14 && t < 0.55) rate.burst = 70;
    if (mode === 'portal_out' && t > 0.05 && t < 0.85) rate.suck = 140;
    for (const kind in rate) {
      spawnAcc[kind] += rate[kind] * dt;
      while (spawnAcc[kind] >= 1) { spawnAcc[kind] -= 1; spawn(kind, P); }
    }
    // схлопывание — последняя вспышка искр
    const closing = mode === 'portal_in' ? t > 0.88 : t > 0.93;
    if (closing && !popped) { popped = true; for (let i = 0; i < 26; i++) spawn('burst', { ...P, r: 4 }); }
    for (const sp of sparks) if (sp.kind !== 'burst') { sp.cx = P.x; sp.cy = P.y; sp.R = P.r; }
  }
  function drawSparks(dt) {
    if (!sparks.length) return;
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (let i = sparks.length - 1; i >= 0; i--) {
      const sp = sparks[i];
      sp.life += dt;
      let x, y;
      if (sp.kind === 'burst') {
        sp.vx *= Math.pow(0.12, dt); sp.vy *= Math.pow(0.12, dt);
        x = sp.x + sp.vx * dt; y = sp.y + sp.vy * dt;
      } else {
        if (sp.cx == null) { sparks.splice(i, 1); continue; }
        sp.a += sp.w * dt * (sp.kind === 'suck' ? 1 + 1.5 / Math.max(sp.rr, 0.2) : 1);
        if (sp.kind === 'suck') sp.rr -= sp.vr * dt;
        x = sp.cx + Math.cos(sp.a) * sp.rr * sp.R; y = sp.cy + Math.sin(sp.a) * sp.rr * sp.R;
      }
      const dead = sp.life > sp.max || (sp.kind === 'suck' && sp.rr < 0.08) || (sp.kind !== 'burst' && sp.R < 2);
      if (dead) { sparks.splice(i, 1); continue; }
      const fade = Math.min(1, sp.life / 0.12) * Math.min(1, (sp.max - sp.life) / 0.25);
      if (sp.px != null) {
        ctx.strokeStyle = `rgba(${ACC.join(',')},${0.28 * fade})`;
        ctx.lineWidth = sp.size * 4 * u;
        ctx.beginPath(); ctx.moveTo(sp.px * u, sp.py * u); ctx.lineTo(x * u, y * u); ctx.stroke();
        ctx.strokeStyle = `rgba(${ACC.join(',')},${fade})`;
        ctx.lineWidth = sp.size * u;
        ctx.stroke();
        if (sp.size > 1.3) { ctx.fillStyle = `rgba(215,255,242,${fade})`; ctx.beginPath(); ctx.arc(x * u, y * u, sp.size * 0.7 * u, 0, 6.283); ctx.fill(); }
      }
      sp.px = x; sp.py = y;
      if (sp.kind === 'burst') { sp.x = x; sp.y = y; }
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // ── Полёт: окно летит по траектории из Blender, от позиции покоя ──
  // осьминог стоит — окно ловит мышь над ним; летит или исчез — мышь проходит насквозь
  const setResting = (rest) => invoke('mascot_rest', { rest }).catch(() => {});
  function moveAlongPath() {
    const p = anim?.path[mode][frame];
    if (!home || !p) return;
    win.setPosition(new PhysicalPosition(Math.round(home.x + p[0] * k * dpr), Math.round(home.y + p[1] * k * dpr))).catch(() => {});
  }
  function goHome() {
    if (home) win.setPosition(new PhysicalPosition(home.x, home.y)).catch(() => {});
  }
  async function fly(kind) {
    if (held) return;
    if (!flying()) {
      try { home = await win.outerPosition(); } catch { home = null; }
    }
    mode = kind; frame = 0; acc = 0; drawn = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    setResting(false);
    moveAlongPath();
  }
  function land() {
    goHome();
    mode = 'rest'; idleFrame = 0; frame = 0;
    setResting(true);
  }
  // улетел: холст пуст, окно возвращается на место
  function vanish() {
    mode = 'gone'; frame = 0;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    goHome();
  }

  // ── Хват за голову ────────────────────────────────────────────────
  function onHead(e) {
    if (flying() || mode === 'gone') return false;
    const r = canvas.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    if (y < SPR_Y * k || y > (SPR_Y + SPR_H * HEAD_BOTTOM) * k) return false;
    const px = sctx.getImageData(Math.floor(x * spr.width / r.width), Math.floor(y * spr.height / r.height), 1, 1).data;
    return px[3] > 40;
  }

  // Окно за курсором ведёт Rust (mascot_drag): захват указателя в WebView2 теряется,
  // как только окно поехало. Об отпускании кнопки приходит событие mascot://drop.
  let held = false;
  canvas.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || held || !onHead(e)) return;
    held = true;
    canvas.classList.add('held');
    if (mode !== 'grab') { mode = 'grab'; if (frame >= LOOP_FROM) frame = 0; }
    invoke('mascot_drag').catch((err) => { console.error('mascot drag', err); drop(); });
  });
  canvas.addEventListener('pointermove', (e) => { if (!held) canvas.classList.toggle('head', onHead(e)); });
  function drop() {
    if (!held) return;
    held = false;
    canvas.classList.remove('held');
    mode = 'release';
    frame = Math.min(frame, RELEASE_FROM);
  }
  win.listen('mascot://drop', drop);

  // ── Показ: маскота прячет и показывает Rust ──────────────────────
  // Окно при этом не скрывается и не обрезается (у прозрачного окна без рамки при этом мелькает
  // белая рамка Windows): спрятанный маскот — пустой холст. Пока он спрятан, петля стоит.
  let running = true, loop = false;
  function run() {
    running = true;
    if (!loop) { loop = true; last = 0; requestAnimationFrame(tick); }
  }
  // payload true — окно только что показано: прилететь; false — уже на экране: если улетал, вернуть
  let entered = false;
  win.listen('mascot://enter', (e) => {
    entered = true;
    run();
    if (ARRIVALS.includes(mode)) return;  // уже прилетает
    if (e.payload || mode === 'gone') fly(arrival());
    else if (DEPARTURES.includes(mode)) land();
  });
  win.listen('mascot://leave', () => { if (!held && mode !== 'gone') fly(departure()); });
  win.listen('mascot://hidden', () => {
    running = false; entered = false;
    if (flying()) vanish();
    mode = 'gone';
    sparks.length = 0;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });

  // запас окна и виден ли маскот знает Rust; пока ответа нет — двукратный запас
  let laidOut = false;
  function relayout() {
    invoke('mascot_layout').then(([, b, shown, how]) => {
      big = b || 2; entrance = how || 'flight'; resize();
      if (laidOut) return;
      laidOut = true;
      // «enter» мог прийти раньше, чем страница загрузилась, — тогда он пролетел мимо
      if (entered) return;
      if (shown) fly(arrival()); else running = false;
    }).catch(() => resize());
  }
  window.addEventListener('resize', relayout);
  win.listen('mascot://layout', relayout);
  resize();
  relayout();
  run();
})();
</script>
</body>
</html>
