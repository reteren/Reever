<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reever — выбор</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="aero.css" />
    <style>
      /* Окно выбора «ривер найди …»: стеклянная рамка как у главного окна, внутри —
         глухая белая панель списка (в семёрке списки всегда непрозрачные). */
      #client {
        flex: 1;
        display: flex;
        flex-direction: column;
        margin: 0 8px 8px;
        min-height: 0;
        background: var(--panel-solid);
        border: 1px solid var(--client-edge);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.7);
      }
      .head {
        padding: 10px 12px 9px;
        border-bottom: 1px solid #d8dde3;
      }
      .head h1 {
        margin: 0;
        font-size: var(--fs-head);
        font-weight: normal;
        color: var(--ink-legend);
      }
      .help {
        display: grid;
        gap: 5px;
        margin-top: 5px;
        font-size: var(--fs-sm);
        color: var(--ink-3);
      }
      .voice-hint { color: var(--ink-2); }
      .voice-hint strong { color: var(--ink-legend); font-weight: 600; }
      .key-hints {
        display: flex;
        align-items: center;
        gap: 5px 12px;
        flex-wrap: wrap;
      }
      .key-hint { white-space: nowrap; }
      .key-hint kbd {
        display: inline-block;
        min-width: 15px;
        padding: 0 3px;
        border: 1px solid #aeb8c2;
        border-bottom-width: 2px;
        border-radius: 2px;
        background: linear-gradient(#fff, #eef1f4);
        color: var(--ink-2);
        font: 10px var(--font-ui);
        text-align: center;
      }
      #list {
        flex: 1;
        overflow-y: auto;
        padding: 0 0 4px;
        outline: none;
      }
      .section {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 6px 12px 4px;
        font-size: var(--fs-sm);
        color: var(--ink-legend);
        font-weight: 600;
        background: #f6f9fc;
        border-bottom: 1px solid #e2e8ef;
      }
      .row {
        display: grid;
        grid-template-columns: 30px 20px minmax(0, 1fr);
        align-items: center;
        gap: 7px;
        margin: 0 4px;
        padding: 5px 8px;
        border: 1px solid transparent;
        border-radius: 3px;
      }
      .row:hover {
        background: linear-gradient(to bottom, #f5fafd, #e8f5fd);
        border-color: #b8d6fb;
      }
      .row.sel {
        background: linear-gradient(to bottom, #dcebfc, #c1dbfc);
        border-color: #7da2ce;
        box-shadow: inset 3px 0 #2d78b7;
      }
      .num {
        font-size: var(--fs-sm);
        color: var(--ink-3);
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .kind { font-size: 15px; line-height: 1; text-align: center; }
      .text { min-width: 0; }
      .name {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 600;
      }
      .path {
        font-size: var(--fs-sm);
        color: var(--ink-3);
        line-height: 1.25;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        direction: rtl;
        text-align: left;
      }
      .foot {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-top: 1px solid #d8dde3;
        font-size: var(--fs-sm);
        color: var(--ink-3);
      }
      .foot .sp { flex: 1; }
    </style>
  </head>
  <body>
    <div id="frame">
      <div id="titlebar" data-tauri-drag-region>
        <div class="tb-icon" data-tauri-drag-region></div>
        <span class="tb-name" data-tauri-drag-region>Reever — найдено</span>
        <div class="sp" data-tauri-drag-region></div>
        <div class="caption-group">
          <button class="winbtn close" id="close" title="Закрыть (Esc)" aria-label="Закрыть"></button>
        </div>
      </div>
      <div id="client">
        <div class="head">
          <h1 id="title">Найдено</h1>
          <div class="help">
            <div class="voice-hint"><strong>Голосом:</strong> скажи номер, например «третий».</div>
            <div class="key-hints" aria-label="Управление с клавиатуры">
              <span class="key-hint"><kbd>↑</kbd> <kbd>↓</kbd> переместить</span>
              <span class="key-hint"><kbd>Enter</kbd> открыть</span>
              <span class="key-hint"><kbd>1–9</kbd> выбрать</span>
              <span class="key-hint"><kbd>Esc</kbd> закрыть</span>
              <span class="key-hint">двойной щелчок — открыть</span>
            </div>
          </div>
        </div>
        <div id="list" tabindex="0" role="listbox" aria-label="Найденные файлы и папки"></div>
        <div class="foot">
          <span id="count"></span>
          <span class="sp"></span>
          <button class="sm" id="cancel">Отмена</button>
          <button class="sm default" id="open">Открыть</button>
        </div>
      </div>
    </div>
    <script>
      const tauri = window.__TAURI__;
      const invoke = tauri?.core?.invoke || (async () => {});
      const $ = selector => document.querySelector(selector);
      let items = [];
      let selected = 0;

      function el(tag, props = {}, ...children) {
        const node = Object.assign(document.createElement(tag), props);
        node.append(...children);
        return node;
      }

      function render(title) {
        $('#title').textContent = title ? `Найдено: «${title}»` : 'Найдено';
        $('#count').textContent = `${items.length} ${plural(items.length)}`;
        const list = $('#list');
        list.replaceChildren();
        // Порядок и номера совпадают с индексами backend: голосовой выбор
        // и invoke используют тот же исходный список.
        const hasFrequent = items.some(item => item.frequent);
        let section = null;
        items.forEach((item, index) => {
          const name = item.frequent ? 'Часто открываемые' : 'Все совпадения';
          if (hasFrequent && name !== section) {
            section = name;
            list.append(el('div', { className: 'section', textContent: name }));
          }
          const row = el('div', { className: 'row', role: 'option' },
            el('span', { className: 'num', textContent: index + 1 }),
            el('span', { className: 'kind', textContent: item.folder ? '📁' : '📄', ariaHidden: 'true' }),
            el('div', { className: 'text' },
              el('div', { className: 'name', textContent: item.name, title: item.name }),
              // rtl + обрезка слева: виден конец пути, где самое различимое
              el('div', { className: 'path', textContent: '‎' + item.path + '‎', title: item.path })));
          row.onclick = () => { selected = index; mark(); };
          row.ondblclick = () => choose(index);
          list.append(row);
        });
        selected = 0;
        mark();
        list.focus();
      }

      function plural(n) {
        const m10 = n % 10, m100 = n % 100;
        if (m10 === 1 && m100 !== 11) return 'вариант';
        if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'варианта';
        return 'вариантов';
      }

      function mark() {
        document.querySelectorAll('.row').forEach((row, index) => {
          row.classList.toggle('sel', index === selected);
          row.setAttribute('aria-selected', index === selected ? 'true' : 'false');
          if (index === selected) row.scrollIntoView({ block: 'nearest' });
        });
      }

      async function choose(index) {
        if (!items[index]) return;
        items = [];
        await invoke('picker_choose', { index });
      }

      async function close() {
        items = [];
        await invoke('picker_close');
      }

      document.addEventListener('keydown', event => {
        if (!items.length) return;
        if (event.key === 'Escape') { event.preventDefault(); close(); }
        else if (event.key === 'Enter') { event.preventDefault(); choose(selected); }
        else if (event.key === 'ArrowDown') { event.preventDefault(); selected = Math.min(items.length - 1, selected + 1); mark(); }
        else if (event.key === 'ArrowUp') { event.preventDefault(); selected = Math.max(0, selected - 1); mark(); }
        else if (event.key === 'Home') { selected = 0; mark(); }
        else if (event.key === 'End') { selected = items.length - 1; mark(); }
        else if (/^[1-9]$/.test(event.key)) { choose(Number(event.key) - 1); }
      });
      $('#close').onclick = close;
      $('#cancel').onclick = close;
      $('#open').onclick = () => choose(selected);

      tauri?.event?.listen('reever://picker', event => {
        items = event.payload?.items || [];
        render(event.payload?.title || '');
      });
    </script>
  </body>
</html>
