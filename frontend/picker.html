<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reever</title>
    <link rel="stylesheet" href="skin.css" />
    <style>
      /* Окно выбора «ривер найди …»: та же хромовая сцена, что и главное окно, но
         проще — гладкий обод без шипов (design/reever-frame.blend, коллекция Picker).
         Под вырезами рамки — ЭЛТ-экраны, кнопка закрытия — тот же стеклянный купол. */
      #pk { position: absolute; inset: 0; width: 620px; height: 520px; }
      #pkDrag { position: absolute; inset: 0; z-index: 0; }
      #pkFrame { position: absolute; left: 0; top: 0; width: 620px; height: 520px; z-index: 3; pointer-events: none; }
      #pkTitle {
        left: 40px; top: 38px; width: 342px; height: 38px; border-radius: 11px; z-index: 1;
        display: flex; align-items: center; gap: 8px; padding: 0 14px;
      }
      #pkTitle .ico { width: 14px; height: 14px; fill: currentColor; stroke: none; filter: drop-shadow(0 0 4px var(--acc)); }
      #title {
        flex: 1; min-width: 0; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        font: 500 21px/1 var(--f-lcd); font-variation-settings: 'ELSH' 2, 'ELGR' 1; letter-spacing: .05em;
        text-transform: uppercase; color: var(--acc-hot); text-shadow: var(--g3);
      }
      #pkScreen {
        left: 40px; top: 88px; width: 540px; height: 394px; border-radius: 13px; z-index: 1;
        display: flex; flex-direction: column;
      }
      #pkClose { left: 568px; top: 57px; --b-off: url(skin/btn_close_off.webp); --b-on: url(skin/btn_close_on.webp); --d: 30px; }
      .head { padding: 12px 16px 10px; border-bottom: 1px dotted var(--acc-4); }
      .help { display: grid; gap: 7px; font-size: 12px; color: var(--acc-3); text-shadow: var(--g1); }
      .voice-hint strong { color: var(--acc-2); font-weight: 600; }
      .key-hints { display: flex; align-items: center; gap: 5px 14px; flex-wrap: wrap; }
      .key-hint { white-space: nowrap; }
      .key-hint kbd {
        display: inline-block; min-width: 18px; padding: 1px 4px 0; border: 1px solid var(--acc-4); border-radius: 3px;
        background: var(--acc-5); color: var(--acc-2); text-align: center;
        font: 500 13px/15px var(--f-lcd); font-variation-settings: 'ELSH' 2, 'ELGR' 1; letter-spacing: .04em;
      }
      #list { flex: 1; overflow-y: auto; padding: 4px 6px 6px; outline: none; }
      .section {
        position: sticky; top: -4px; z-index: 1; padding: 8px 10px 5px; margin: 0 -6px;
        font: 500 14px/1 var(--f-lcd); font-variation-settings: 'ELSH' 2, 'ELGR' 1; letter-spacing: .08em; text-transform: uppercase;
        color: var(--acc-3); background: var(--glass); border-bottom: 1px dotted var(--acc-4);
      }
      .row {
        display: grid; grid-template-columns: 26px 18px minmax(0, 1fr); align-items: center; gap: 9px;
        padding: 5px 10px; border-radius: 5px; cursor: pointer; transition: background-color .12s;
      }
      .row:hover { background: var(--acc-5); }
      .row.sel { background: var(--acc); color: var(--glass); text-shadow: none; box-shadow: 0 0 14px rgba(39, 230, 170, .35); }
      .num {
        font: 500 17px/1 var(--f-lcd); font-variation-settings: 'ELSH' 2, 'ELGR' 1; color: var(--acc-3);
        text-align: right; font-variant-numeric: tabular-nums;
      }
      .kind { width: 18px; height: 18px; color: var(--acc-2); }
      .text { min-width: 0; }
      .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; color: var(--acc-hot); }
      .path {
        font: 400 11px/1.3 var(--f-data); color: var(--acc-3); text-shadow: none;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left;
      }
      .row.sel .num, .row.sel .kind, .row.sel .name, .row.sel .path { color: var(--glass); text-shadow: none; }
      .foot {
        display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-top: 1px dotted var(--acc-4);
        font: 500 15px/1 var(--f-lcd); font-variation-settings: 'ELSH' 2, 'ELGR' 1; letter-spacing: .06em; text-transform: uppercase;
        color: var(--acc-3);
      }
      .foot .sp { flex: 1; }
    </style>
    <script src="i18n/i18n.js"></script>
    <script src="i18n/locales/en.js"></script>
  </head>
  <body>
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-tray" viewBox="0 0 24 24"><path d="M12 4.5v9M8 10l4 4 4-4M5.5 18.5h13"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 6.5h6l2 2h9v10h-17z"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M6.5 3.5h7l4 4v13h-11zM13.5 3.5v4h4"/></symbol>
    </svg>
    <div id="pk">
      <div id="pkDrag" data-tauri-drag-region></div>
      <img id="pkFrame" src="skin/picker_frame.webp" alt="" draggable="false" />
      <div class="lcd" id="pkTitle" data-tauri-drag-region>
        <svg class="ico" aria-hidden="true"><use href="#i-play"/></svg>
        <h1 id="title" data-tauri-drag-region></h1>
      </div>
      <button class="lunka" id="pkClose" data-i18n-title="picker.closeTitle" data-i18n-aria-label="common.close"><svg class="ico"><use href="#i-tray"/></svg></button>
      <div class="lcd" id="pkScreen">
        <div class="head">
          <div class="help">
            <div class="voice-hint" data-i18n-html="picker.voice"></div>
            <div class="key-hints" data-i18n-aria-label="picker.keyboard">
              <span class="key-hint"><kbd>↑</kbd> <kbd>↓</kbd> <span data-i18n="picker.move">переместить</span></span>
              <span class="key-hint"><kbd>Enter</kbd> <span data-i18n="picker.open">открыть</span></span>
              <span class="key-hint"><kbd>1–9</kbd> <span data-i18n="picker.select">выбрать</span></span>
              <span class="key-hint"><kbd>Esc</kbd> <span data-i18n="picker.close">закрыть</span></span>
              <span class="key-hint" data-i18n="picker.doubleClick">двойной щелчок — открыть</span>
            </div>
          </div>
        </div>
        <div id="list" tabindex="0" role="listbox" data-i18n-aria-label="picker.list"></div>
        <div class="foot">
          <span id="count"></span>
          <span class="sp"></span>
          <button class="sm" id="cancel" data-i18n="common.cancel">Отмена</button>
          <button class="sm default" id="open" data-i18n="picker.openButton">Открыть</button>
        </div>
      </div>
    </div>
    <script>
      const tauri = window.__TAURI__;
      const invoke = tauri?.core?.invoke || (async () => {});
      const $ = selector => document.querySelector(selector);
      let items = [];
      let selected = 0;

      function el(tag, props = {}, ...children) {
        const node = Object.assign(document.createElement(tag), props);
        node.append(...children);
        return node;
      }

      // значок папки/файла — тем же штрихом, что и иконки главного окна
      function kindIcon(folder) {
        const ns = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(ns, 'svg');
        svg.setAttribute('class', 'ico kind'); svg.setAttribute('aria-hidden', 'true');
        const use = document.createElementNS(ns, 'use'); use.setAttribute('href', folder ? '#i-folder' : '#i-file');
        svg.append(use);
        return svg;
      }

      function render(title) {
        $('#title').textContent = title ? t('picker.foundFor', { title }) : t('picker.found');
        $('#count').textContent = t('picker.count', { count: items.length });
        const list = $('#list');
        list.replaceChildren();
        // Порядок и номера совпадают с индексами backend: голосовой выбор
        // и invoke используют тот же исходный список.
        const hasFrequent = items.some(item => item.frequent);
        let section = null;
        items.forEach((item, index) => {
          const name = t(item.frequent ? 'picker.frequent' : 'picker.all');
          if (hasFrequent && name !== section) {
            section = name;
            list.append(el('div', { className: 'section', textContent: name }));
          }
          const row = el('div', { className: 'row', role: 'option' },
            el('span', { className: 'num', textContent: index + 1 }),
            kindIcon(item.folder),
            el('div', { className: 'text' },
              el('div', { className: 'name', textContent: item.name, title: item.name }),
              // rtl + обрезка слева: виден конец пути, где самое различимое
              el('div', { className: 'path', textContent: '‎' + item.path + '‎', title: item.path })));
          row.onclick = () => { selected = index; mark(); };
          row.ondblclick = () => choose(index);
          list.append(row);
        });
        selected = 0;
        mark();
        list.focus();
      }

      function mark() {
        document.querySelectorAll('.row').forEach((row, index) => {
          row.classList.toggle('sel', index === selected);
          row.setAttribute('aria-selected', index === selected ? 'true' : 'false');
          if (index === selected) row.scrollIntoView({ block: 'nearest' });
        });
      }

      async function choose(index) {
        if (!items[index]) return;
        items = [];
        await invoke('picker_choose', { index });
      }

      async function close() {
        items = [];
        await invoke('picker_close');
      }

      document.addEventListener('keydown', event => {
        if (!items.length) return;
        if (event.key === 'Escape') { event.preventDefault(); close(); }
        else if (event.key === 'Enter') { event.preventDefault(); choose(selected); }
        else if (event.key === 'ArrowDown') { event.preventDefault(); selected = Math.min(items.length - 1, selected + 1); mark(); }
        else if (event.key === 'ArrowUp') { event.preventDefault(); selected = Math.max(0, selected - 1); mark(); }
        else if (event.key === 'Home') { selected = 0; mark(); }
        else if (event.key === 'End') { selected = items.length - 1; mark(); }
        else if (/^[1-9]$/.test(event.key)) { choose(Number(event.key) - 1); }
      });
      $('#pkClose').onclick = close;
      $('#cancel').onclick = close;
      $('#open').onclick = () => choose(selected);

      // Язык — из settings.json при каждом показе: его могли сменить в главном окне.
      async function applyLanguage() {
        let preference = 'auto';
        try { preference = (await invoke('get_settings'))?.ui_language || 'auto'; } catch {}
        await I18N.setLanguage(preference);
      }
      applyLanguage();

      // Предпросмотр в браузере для снимков (?shot): пример списка без backend.
      if (!tauri && new URLSearchParams(location.search).has('shot')) {
        document.body.style.background = '#2a2f33';
        I18N.setLanguage('ru').then(() => {
          items = [
            { name: '-PROJECT.GST-', path: 'C:\\-PROJECT.GST-', folder: true, frequent: true },
            { name: 'ProjectGST', path: 'C:\\OProjectodoGST\\ProjectGST', folder: true },
            { name: 'ProjectGST', path: 'C:\\Memory_Vault\\PROJECTS\\ProjectGST', folder: true },
            { name: 'PROJECT GST.md', path: 'C:\\-PROJECT.GST-\\obsidian\\PROJECT GST.md', folder: false },
            { name: 'ProjectGST_Data', path: 'C:\\OProjectodoGST\\ProjectGST\\bt\\ProjectGST_Data', folder: true },
            { name: 'OProjectodoGST', path: 'C:\\OProjectodoGST', folder: true },
            { name: 'ProjectGST_BurstDebugInformation_DoNotShip', path: 'C:\\OProjectodoGST\\ProjectGST\\bt\\ProjectGST_BurstDebugInformation_DoNotShip', folder: true },
          ];
          render('project vsta');
        });
      }

      async function listenForPicker() {
        if (!tauri?.event?.listen) return;
        await tauri.event.listen('reever://picker', async event => {
          const payload = event.payload;
          await applyLanguage();
          items = payload?.items || [];
          render(payload?.title || '');
        });
        await invoke('picker_ready');
      }
      listenForPicker();
    </script>
  </body>
</html>
