<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reever</title>
    <link rel="stylesheet" href="skin.css" />
    <style>
      /* Меню значка в трее (src-tauri/src/traymenu.rs): ЭЛТ-табло вместо системного меню
         Windows. Окно создаётся по правому клику и закрывается, как только теряет фокус. */
      #tm {
        position: absolute; inset: 4px; border-radius: 10px; padding: 0 6px 6px;
        display: flex; flex-direction: column;
        border: 1px solid var(--acc-3);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, .8), 0 0 16px rgba(39, 230, 170, .2);
        opacity: 0; transform: translateY(4px);
        transition: opacity .14s var(--e-out), transform .2s var(--e-out);
      }
      #tm.on { opacity: 1; transform: none; }
      .head { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 6px; border-bottom: 1px solid var(--acc-4); margin-bottom: 4px; }
      .head .logotype { font-size: 17px; }
      .head .dot { margin-left: auto; width: 8px; height: 8px; }
      .head .dot.on { background: var(--acc); box-shadow: 0 0 8px var(--acc), 0 0 2px var(--acc-hot); }
      .head .dot.paused { background: transparent; box-shadow: inset 0 0 0 1.5px var(--acc-3); }
      .item {
        position: relative; z-index: 21; display: flex; align-items: center; gap: 10px;
        width: 100%; height: 32px; padding: 0 8px; border: 0; border-radius: 5px; cursor: pointer;
        background: transparent; text-align: left;
        font: 500 16px/1 var(--f-lcd); font-variation-settings: 'ELSH' 2, 'ELGR' 1; letter-spacing: .06em; text-transform: uppercase;
        color: var(--acc); text-shadow: var(--g2);
        transition: background-color .1s, color .1s;
      }
      .item span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .item .ico { width: 16px; height: 16px; filter: drop-shadow(0 0 3px var(--acc-3)); }
      .item.sel { background: var(--acc-4); color: var(--acc-hot); text-shadow: var(--g3); }
      .item:active { background: var(--acc); color: var(--glass); text-shadow: none; }
      .item:active .ico { filter: none; }
      .item:focus-visible { outline: none; }
      .sep { height: 1px; margin: 4px 6px; background: var(--acc-4); }
      @media (prefers-reduced-motion: reduce) { #tm { transition: none; transform: none; } }
    </style>
  </head>
  <body>
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-show" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="12" rx="2"/><path d="M8.5 20h7M12 16.5V20"/></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5"/></symbol>
      <symbol id="i-mic-off" viewBox="0 0 24 24"><path d="M15 9.5V6.5a3 3 0 0 0-5.8-1.1M9 9v2.5a3 3 0 0 0 4.6 2.5M5.5 11.5a6.5 6.5 0 0 0 10.6 5M18.5 11.5a6.5 6.5 0 0 1-.4 2.2M12 18v2.5M4 4l16 16"/></symbol>
      <symbol id="i-quit" viewBox="0 0 24 24"><path d="M12 3.5v8M7.2 6.3a7 7 0 1 0 9.6 0"/></symbol>
    </svg>
    <div class="lcd" id="tm" role="menu">
      <div class="head">
        <span class="logotype">REEVER</span>
        <i class="dot" id="state"></i>
      </div>
      <button class="item" role="menuitem" data-action="show"><svg class="ico"><use href="#i-show"/></svg><span id="show"></span></button>
      <button class="item" role="menuitem" data-action="pause"><svg class="ico"><use id="micIcon" href="#i-mic"/></svg><span id="pause"></span></button>
      <div class="sep"></div>
      <button class="item" role="menuitem" data-action="quit"><svg class="ico"><use href="#i-quit"/></svg><span id="quit"></span></button>
    </div>
    <script>
      const tauri = window.__TAURI__;
      const invoke = tauri?.core?.invoke || (async () => {});
      const $ = selector => document.querySelector(selector);
      const items = [...document.querySelectorAll('.item')];
      let busy = false;

      function select(item) {
        for (const other of items) other.classList.toggle('sel', other === item);
        item?.focus({ preventScroll: true });
      }

      function render({ labels, paused }) {
        busy = false;
        for (const key of ['show', 'pause', 'quit']) $('#' + key).textContent = labels[key] || key;
        $('#state').className = 'dot ' + (paused ? 'paused' : 'on');
        $('#micIcon').setAttribute('href', paused ? '#i-mic-off' : '#i-mic');
        select(null);
        const menu = $('#tm');
        menu.classList.remove('on');
        requestAnimationFrame(() => menu.classList.add('on'));
      }

      async function run(action) {
        if (busy) return;
        busy = true;
        await invoke('traymenu_action', { action });
      }

      for (const item of items) {
        item.addEventListener('mouseenter', () => select(item));
        item.addEventListener('click', () => run(item.dataset.action));
      }
      $('#tm').addEventListener('mouseleave', () => select(null));
      document.addEventListener('contextmenu', event => event.preventDefault());
      document.addEventListener('keydown', event => {
        const index = items.indexOf(document.activeElement);
        if (event.key === 'Escape') { event.preventDefault(); run('close'); }
        else if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
          event.preventDefault();
          const step = event.key === 'ArrowDown' ? 1 : -1;
          select(items[(index + step + items.length) % items.length] || items[0]);
        } else if (event.key === 'Enter' && index >= 0) { event.preventDefault(); run(items[index].dataset.action); }
      });

      // Предпросмотр в браузере (?shot): без backend.
      if (!tauri && new URLSearchParams(location.search).has('shot')) {
        document.body.style.background = '#2a2f33';
        render({ labels: { show: 'Показать настройки', pause: 'Пауза / Продолжить микрофон', quit: 'Выход' }, paused: false });
      }

      (async () => {
        if (!tauri?.event?.listen) return;
        await tauri.event.listen('reever://traymenu', event => render(event.payload));
        await invoke('traymenu_ready');
      })();
    </script>
  </body>
</html>
