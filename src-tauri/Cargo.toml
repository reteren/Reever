[package]
name = "reever"
version = "0.1.5"
edition = "2021"
description = "Reever — offline voice launcher for Windows"

# Библиотека — всё приложение (тесты и examples/ собираются против неё),
# бинарь — только точка входа. Имя отличается от пакета: на Windows одинаковые
# имена lib и bin конфликтуют по .pdb.
[lib]
name = "reever_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri      = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart       = "2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow     = "1"
strsim     = "0.11"

# audio
cpal   = "0.15"
rodio  = "0.19"
rubato = "0.15"

# ASR (GigaAM v3) + VAD (Silero) — sherpa-onnx, статическая линковка, prebuilt
# скачивается build-скриптом крейта (или берётся из SHERPA_ONNX_LIB_DIR).
sherpa-onnx = "1.13.8"

# shortcut parsing
lnk = "0.5"

[dependencies.windows]
version  = "0.58"
features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_Environment",
  "Win32_System_LibraryLoader",
]

[profile.release]
opt-level = 3
lto = true
strip = true
