[package]
name = "reever"
version = "0.1.0"
edition = "2021"
description = "Reever — voice interface for the Everything search utility"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri      = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart       = "2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow     = "1"
strsim     = "0.11"

# audio
cpal   = "0.15"
rodio  = "0.19"
rubato = "0.15"

# speech recognition (needs native libvosk in vendor/vosk + libvosk.dll at runtime)
vosk = "0.3"

# shortcut parsing
lnk = "0.5"

[dependencies.windows]
version  = "0.58"
features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_Environment",
  "Win32_System_LibraryLoader",
]

[profile.release]
opt-level = 3
lto = true
strip = true
