[package]
name = "reever"
version = "0.8.6"
edition = "2021"
description = "Reever — offline voice launcher for Windows"

# Библиотека — всё приложение (тесты и examples/ собираются против неё),
# бинарь — только точка входа. Имя отличается от пакета: на Windows одинаковые
# имена lib и bin конфликтуют по .pdb.
[lib]
name = "reever_lib"
path = "src/lib.rs"

[build-dependencies]
# build.rs: значок, версия и манифест exe (windows/reever.rc)
embed-resource = "3"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
intl_pluralrules = "7.0.2"
unic-langid = "0.9"
anyhow     = "1"
strsim     = "0.11"
# native/: специальные возможности нативных окон (UI Automation через сырой HWND)
accesskit         = "0.25"
accesskit_windows = "0.35"

# audio
cpal   = "0.15"
rodio  = "0.19"
rubato = "0.15"

# ASR (GigaAM v3) + VAD (Silero) — sherpa-onnx, статическая линковка, prebuilt
# скачивается build-скриптом крейта (или берётся из SHERPA_ONNX_LIB_DIR).
sherpa-onnx = "1.13.8"

# shortcut parsing
lnk = "0.5"

# appscan.rs: иконки программ в списке сканера (PNG data-URL)
png    = "0.17"
base64 = "0.22"

[dependencies.windows]
version  = "0.58"
features = [
  "Win32_Security",
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_IO",
  "Win32_Security",
  "Win32_System_Environment",
  "Win32_System_LibraryLoader",
  # procs.rs: перебор процессов, описание exe, скрытые (cloaked) окна
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_Storage_FileSystem",
  "Win32_Graphics_Dwm",
  # skin.rs: фигурное окно по силуэту рамки
  "Win32_Graphics_Gdi",
  # typing.rs: поле ввода в фокусе (UI Automation) и буфер обмена для диктовки
  "Win32_System_Com",
  "Win32_UI_Accessibility",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  # spellcheck.rs: словарная проверка языка куска диктовки
  "Win32_Globalization",
  # events.rs: местное время в журнале
  "Win32_System_SystemInformation",
  # micwatch.rs: громкость микрофона в Windows (её меняют другие программы, например Discord)
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  # micwatch.rs: какой микрофон сейчас по умолчанию и его имя — переход на новый
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Devices_FunctionDiscovery",
  # appscan.rs: как часто запускаются программы (UserAssist в реестре)
  "Win32_System_Registry",
  # traymenu.rs: меню трея рисуется само (owner-draw) под DPI монитора
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  # native/: окна без WebView2 — Direct2D + DirectWrite + WIC + DirectComposition
  "Foundation_Numerics",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Imaging",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  # mascot_native/: линза глаза — пиксельный шейдер, компилируется при запуске (d3dcompiler_47)
  "Win32_Graphics_Direct3D_Fxc",
  # native/: окна выбора и подтверждения — ввод иероглифов (IME) в поле поиска
  "Win32_UI_Input_Ime",
  # transcribe.rs: аудио и видео файлы в текст — декодирование через Media Foundation
  "Win32_Media_MediaFoundation",
  # вкладка «Текст»: окно «Открыть» с фильтром аудио и видео
  "Win32_UI_Shell_Common",
]

[profile.release]
opt-level = 3
lto = true
strip = true
